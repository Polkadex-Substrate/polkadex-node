# Polkadex token contracts for Hyperbridge. Compiler settings follow polytope-labs/hyperbridge.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = true
# Only remappings.txt: the OpenZeppelin submodules carry their own remappings for their nested submodules.
auto_detect_remappings = false
