name: Build and publish release

on:
  push:
    tags:
      - 'v*'

# SECURITY (F-082): least-privilege default. Only the release job needs to
# create a release / upload assets; nothing here needs broader write access.
permissions:
  contents: write

jobs:
  build-and-publish-release:
    name: Build packages and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # SECURITY (F-082): no toolchain install step here on purpose. The repo's
      # own rust-toolchain.toml (channel 1.91.0, correct targets) is picked up
      # automatically by rustup the moment any cargo/rustup command runs from
      # inside the checkout — GitHub's ubuntu-latest runner ships rustup
      # preinstalled. This replaces scripts/init.sh, which mutated toolchains
      # unpinned (`rustup update nightly`/`stable`) and pulled an unrelated,
      # years-old `nightly-2021-06-28` toolchain nothing here still needs.
      - name: System build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes clang protobuf-compiler libssl-dev

      - name: Cache rust dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release -p polkadex-node

      - name: Build .deb and .rpm packages
        run: ./packaging/build-packages.sh

      - name: Assemble release artifacts and checksums
        run: |
          set -euo pipefail
          cp target/release/polkadex-node dist/polkadex-node
          cp extras/customSpecRaw.json dist/customSpecRaw.json
          cd dist
          sha256sum polkadex-node customSpecRaw.json *.deb *.rpm > SHA256SUMS
          cat SHA256SUMS

      - name: Upload binary artifact for Docker build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: polkadex-node-binary
          path: dist/polkadex-node
          if-no-files-found: error

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # SECURITY (F-082): draft, not published — a human confirms the
          # release before it goes live to validators pulling packages.
          draft: true
          prerelease: false
          name: Release ${{ github.ref_name }}
          body_path: .github/release-notes-template.md
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/polkadex-node
            dist/customSpecRaw.json
            dist/SHA256SUMS

  push-to-docker-registry:
    name: Push Docker Image To Docker Hub
    runs-on: ubuntu-latest
    needs: [ build-and-publish-release ]
    steps:
      - name: Log in to the Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Extract metadata (tags, labels) for docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: polkadex/mainnet

      - name: Download binary artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: polkadex-node-binary
          path: ${{ github.workspace }}

      - name: Make binary executable
        run: chmod +x ${{ github.workspace }}/polkadex-node

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          push: true
          file: ${{ github.workspace }}/.docker/ci/release/Dockerfile
          context: ${{ github.workspace }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  update-on-finality:
    name: OnFinality Network Spec Update
    runs-on: ubuntu-latest
    needs: [ build-and-publish-release, push-to-docker-registry ]
    steps:
      - name: Update image version of the existing network spec
        uses: OnFinality-io/action-onf-release@fc85bd197336bbca665d2f38642f128930900cf6 # v1
        with:
          onf-access-key: ${{ secrets.ONF_ACCESS_KEY }}
          onf-secret-key: ${{ secrets.ONF_SECRET_KEY }}
          onf-workspace-id: ${{ secrets.ONF_WORKSPACE_ID }}
          onf-network-key: ${{ secrets.ONF_NETWORK_KEY }}
          onf-sub-command: image
          onf-action: add
          image-version: ${{ github.ref_name }}
