name: Build and publish release

on:
  push:
    tags:
      - 'v*'

# SECURITY (F-082): least-privilege default. Only the release job needs to
# create a release / upload assets; nothing here needs broader write access.
permissions:
  contents: write

jobs:
  build-and-publish-release:
    name: Build packages and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # SECURITY (F-082): no toolchain install step here on purpose. The repo's
      # own rust-toolchain.toml (channel 1.91.0, correct targets) is picked up
      # automatically by rustup the moment any cargo/rustup command runs from
      # inside the checkout — GitHub's ubuntu-latest runner ships rustup
      # preinstalled. This replaces scripts/init.sh, which mutated toolchains
      # unpinned (`rustup update nightly`/`stable`) and pulled an unrelated,
      # years-old `nightly-2021-06-28` toolchain nothing here still needs.
      # No libssl-dev here on purpose — checked Cargo.lock for openssl-sys/
      # native-tls/any C-level SSL binding crate (none exist; the workspace
      # uses rustls) and confirmed via `ldd` that the built binary links no
      # OpenSSL/libcrypto at all. It was carried forward as boilerplate
      # (even ci.yml's commented-out equivalent line still lists it) without
      # anyone having verified it's actually needed to compile.
      - name: System build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes clang protobuf-compiler

      - name: Cache rust dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release -p polkadex-node

      - name: Build .deb and .rpm packages
        run: ./packaging/build-packages.sh

      - name: Assemble release artifacts and checksums
        run: |
          set -euo pipefail
          cp target/release/polkadex-node dist/polkadex-node
          cp extras/customSpecRaw.json dist/customSpecRaw.json
          cd dist
          sha256sum polkadex-node customSpecRaw.json *.deb *.rpm > SHA256SUMS
          cat SHA256SUMS

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # SECURITY (F-082): draft, not published — a human confirms the
          # release before it goes live to validators pulling packages.
          draft: true
          prerelease: false
          name: Release ${{ github.ref_name }}
          body_path: .github/release-notes-template.md
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/polkadex-node
            dist/customSpecRaw.json
            dist/SHA256SUMS
