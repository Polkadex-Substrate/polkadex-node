[profile.release]
panic = "unwind"

[workspace]
resolver = "2"
members = [
  "client",
  "nodes/mainnet",
  "runtimes/mainnet",
  "rpc/assets",
  "rpc/swap",
  "rpc/assets/runtime-api",
  "pallets/pdex-migration",
  "pallets/liquidity-mining",
  "pallets/ocex",
  "pallets/ocex/rpc",
  "pallets/ocex/rpc/runtime-api",
  "pallets/rewards",
  "primitives/orderbook",
  "primitives/polkadex",
  "primitives/thea",
  "primitives/bls",
  "pallets/thea",
  "pallets/rewards/rpc",
  "pallets/rewards/rpc/runtime-api",
  "misc/load-testing",
  "misc/crowdloan-verifier",
]
exclude = ["scripts/check-off-on-deviation"]

