[profile.release]
panic = "unwind"

[workspace]
resolver = "2"
members = [
  "client",
  "nodes/mainnet",
  # "nodes/parachain",
  "runtimes/mainnet",
  # "runtimes/parachain",
  "rpc/assets",
  "rpc/swap",
  "rpc/assets/runtime-api",
  "pallets/pdex-migration",
  "pallets/liquidity-mining",
  "pallets/ocex",
  "pallets/ocex/rpc",
  "pallets/ocex/rpc/runtime-api",
  "pallets/rewards",
  "primitives/orderbook",
  "primitives/polkadex",
  "primitives/thea",
  "primitives/bls",
  "pallets/thea",
  # "pallets/thea-executor",
  # "pallets/thea-message-handler",
  "pallets/rewards/rpc",
  "pallets/rewards/rpc/runtime-api",
  # "pallets/thea-council",
  # "pallets/xcm-helper",
  "misc/load-testing",
  "misc/crowdloan-verifier",
  # "polkadex-xcm-simulator",
]
